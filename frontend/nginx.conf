server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Optional HTTP Basic Auth for the whole app (static UI + /api/ proxy + SSE).
  # This snippet is (re)written at container startup by
  # /docker-entrypoint.d/40-odin-basic-auth.sh: it contains auth_basic directives
  # when ODIN_AUTH_USER/ODIN_AUTH_PASSWORD are set, and is empty otherwise.
  include /etc/nginx/auth_snippet.conf;

  location /api/ {
    proxy_pass http://odin-app-api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Required for SSE (Phase 3+)
    proxy_buffering off;
    proxy_cache off;
    # MinKNOW directory scans on Windows/WSL2 9P filesystem can be slow.
    # SSE log streams can be silent for several minutes during long pipeline runs
    # (e.g. while Nextflow pulls container images). 600s keeps the connection alive.
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
