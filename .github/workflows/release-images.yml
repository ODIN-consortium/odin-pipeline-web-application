# Builds the application's container images from this public repository and publishes them to
# the GitHub Container Registry (ghcr.io/odin-consortium/...), one image per release tag.
#
# The published images depend on nothing outside this repository: no internal registry, no
# corporate certificates (the ca/ directory is empty here, so that build step is a no-op).
# Tags are never rebuilt or moved; pin deployments by digest (image@sha256:...) for an exact copy.

name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.0.37"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: odin-pipeline-api
            dockerfile: Dockerfile.backend
          - image: odin-pipeline-ui
            dockerfile: Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/odin-consortium/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
