[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odin-pipeline"
version = "0.1.0"
description = "ODIN Pipeline web application backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
    "python-multipart>=0.0.19",
    "python-dotenv>=1.0.0",
    "pycountry>=24.6.1",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",     # for FastAPI TestClient
    "ruff>=0.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort
ignore = [
    "E402",   # module-level import not at top — needed after load_dotenv()
    "E501",   # line too long — SQL strings are kept on one line for readability
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
